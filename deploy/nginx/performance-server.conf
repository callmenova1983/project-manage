# Merge into the EXISTING TLS server {}. Do not replace its TLS/auth configuration.
# On Nginx >=1.25.1, enable `http2 on;` alongside existing `listen 443 ssl;`.
http2 on;
access_log /var/log/nginx/pm-performance.log pm_performance;

location = /api/workspace/events {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
# Keep the existing / location and proxy headers. Fastify sets immutable only for
# hashed /assets files, no-store for HTML and private API responses. Do not add
# blanket public caching or an expires directive to /api or HTML.
