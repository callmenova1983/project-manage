# Include once inside http {}, e.g. /etc/nginx/conf.d/pm-performance-http.conf.
# Retain existing server_name, certificate paths and origin/auth policies.
log_format pm_performance '$time_iso8601 $request_method $uri $status '
                         'request=$request_time upstream=$upstream_response_time '
                         'bytes=$body_bytes_sent gzip=$gzip_ratio';
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
