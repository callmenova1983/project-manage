name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-built.mjs
      - run: npm run test:e2e
      - run: node scripts/smoke-codespaces.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/
            playwright-report/
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-collaboration.mjs
      - run: node scripts/measure-scale.mjs
      - run: node scripts/profile-filter.mjs
      - run: node scripts/diagnose-filter.mjs
      - run: node scripts/check-scale-filter.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-evidence
          path: artifacts/
