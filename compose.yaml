services:
  app:
    build:
      context: .
      args:
        VITE_WORKSPACE_CORE: ${VITE_WORKSPACE_CORE:-1}
        VITE_WORKSPACE_SSE: ${VITE_WORKSPACE_SSE:-1}
    ports:
      - "127.0.0.1:${PM_HTTP_PORT:-3001}:3001"
    # Use a private runtime file. Server deployments set PM_ENV_FILE to an
    # absolute path outside the release checkout, so code updates preserve it.
    env_file:
      - ${PM_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    volumes:
      - project_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  project_data:
